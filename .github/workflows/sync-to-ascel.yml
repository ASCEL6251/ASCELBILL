name: Sync to ASCELBILL (Trigger Cloudflare Deploy)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  sync:
    name: Sync main branch to ASCEL6251/ASCELBILL
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync main to ASCEL6251/ASCELBILL
        env:
          SYNC_TOKEN: ${{ secrets.ASCEL_GITHUB_TOKEN || secrets.SYNC_TOKEN || secrets.GH_PAT }}
        run: |
          if [ -z "$SYNC_TOKEN" ]; then
            echo "::error::Secret ASCEL_GITHUB_TOKEN (or SYNC_TOKEN) is not set in repository secrets!"
            echo "Please add a GitHub Personal Access Token to Settings -> Secrets and variables -> Actions"
            exit 1
          fi

          echo "Configuring git credentials..."
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          echo "Pushing main branch to ASCEL6251/ASCELBILL..."
          git push --force "https://x-access-token:${SYNC_TOKEN}@github.com/ASCEL6251/ASCELBILL.git" main:main --tags

          echo "Successfully synced main branch to https://github.com/ASCEL6251/ASCELBILL"

      - name: Trigger Cloudflare Deploy Hook (Optional)
        env:
          DEPLOY_HOOK: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK }}
        run: |
          if [ -n "$DEPLOY_HOOK" ]; then
            echo "Triggering Cloudflare Deploy Hook..."
            curl -s -X POST "$DEPLOY_HOOK" -o /dev/null -w "Deploy hook response HTTP code: %{http_code}\n"
          else
            echo "No CLOUDFLARE_DEPLOY_HOOK configured; skipping deploy hook trigger."
          fi
